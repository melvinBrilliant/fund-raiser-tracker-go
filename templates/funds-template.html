<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fund Raiser Tracker</title>
  <style>
    :root {
      color-scheme: light;
      --background: {{.BackgroundColor}};
      --foreground: #f4f1de;
      --accent: {{.FontColor}};
    }

    * { box-sizing: border-box; }

    html {
      background-color: #011D66;
      background-color: var(--background);
    }

    body {
      background: transparent;
      color: var(--foreground);
      font-family: Georgia, serif;
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .ticker {
      align-items: center;
      background-color: #011D66;
      background-color: var(--background);
      bottom: 0;
      display: flex;
      height: clamp(64px, 10vh, 120px);
      left: 0;
      overflow: hidden;
      position: fixed;
      white-space: nowrap;
      width: 100vw;
    }

    .ticker__track {
      animation: berjalan {{.AnimationDuration}}s linear infinite;
      display: inline-block;
      padding-left: 100%;
    }

    .ticker__item {
      color: var(--accent);
      font-size: {{.FontSize}}px;
      font-weight: bold;
      margin-right: 4rem;
    }

    @keyframes berjalan {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker__track { animation-play-state: paused; }
    }
  </style>
</head>
<body>
  <main class="ticker" aria-label="Daftar donasi">
    <div class="ticker__track">
      {{range .Funds}}<span class="ticker__item">{{.Name}} {{.Amount}}</span>{{end}}
    </div>
  </main>
  <script>
    const refreshInterval = {{.RefreshInterval}};
    if (refreshInterval > 0) {
      setTimeout(() => {
        const refreshedURL = new URL(window.location.href);
        refreshedURL.searchParams.set("refresh", Date.now());
        window.location.replace(refreshedURL.toString());
      }, refreshInterval * 1000);
    }
  </script>
</body>
</html>
