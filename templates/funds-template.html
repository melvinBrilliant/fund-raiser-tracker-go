<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fund Raiser Tracker</title>
  <style>
    :root {
      color-scheme: light;
      --background: {{.BackgroundColor}};
      --foreground: #f4f1de;
      --accent: {{.FontColor}};
    }

    * { box-sizing: border-box; }

    body {
      align-items: center;
      background: var(--background);
      color: var(--foreground);
      display: flex;
      font-family: Georgia, serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }

    .ticker {
      overflow: hidden;
      white-space: nowrap;
      width: 100%;
    }

    .ticker__track {
      animation: berjalan {{.AnimationDuration}}s linear infinite;
      display: inline-block;
      padding-left: 100%;
    }

    .ticker__item {
      color: var(--accent);
      font-size: clamp(1.5rem, 5vw, 4rem);
      font-weight: bold;
      margin-right: 4rem;
    }

    @keyframes berjalan {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker__track { animation-play-state: paused; }
    }
  </style>
</head>
<body>
  <main class="ticker" aria-label="Daftar donasi">
    <div class="ticker__track">
      {{range .Funds}}<span class="ticker__item">{{.Name}} {{.Amount}}</span>{{end}}
    </div>
  </main>
</body>
</html>
